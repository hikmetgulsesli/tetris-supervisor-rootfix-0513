<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Over</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@600;700&amp;family=Geist:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#594400",
                        "on-primary-fixed-variant": "#4f378a",
                        "on-tertiary-fixed": "#241a00",
                        "on-background": "#e6e0e9",
                        "surface-container-high": "#2b292f",
                        "tertiary-fixed-dim": "#e7c365",
                        "outline-variant": "#494551",
                        "on-error": "#690005",
                        "surface-container-low": "#1d1b20",
                        "on-tertiary-container": "#503d00",
                        "error-container": "#93000a",
                        "surface-variant": "#36343a",
                        "surface": "#141218",
                        "on-primary": "#381e72",
                        "inverse-on-surface": "#322f35",
                        "on-secondary-container": "#bfb2da",
                        "tertiary": "#e7c365",
                        "surface-container": "#211f24",
                        "surface-container-highest": "#36343a",
                        "surface-tint": "#cfbcff",
                        "secondary-fixed-dim": "#cdc0e9",
                        "inverse-primary": "#6750a4",
                        "on-secondary-fixed-variant": "#4b4263",
                        "secondary-container": "#4d4465",
                        "surface-dim": "#141218",
                        "on-surface-variant": "#cbc4d2",
                        "primary-fixed-dim": "#cfbcff",
                        "primary": "#cfbcff",
                        "background": "#141218",
                        "tertiary-fixed": "#ffdf93",
                        "on-error-container": "#ffdad6",
                        "outline": "#948e9c",
                        "inverse-surface": "#e6e0e9",
                        "surface-bright": "#3b383e",
                        "tertiary-container": "#c9a74d",
                        "error": "#ffb4ab",
                        "on-primary-container": "#e0d2ff",
                        "on-tertiary": "#3e2e00",
                        "secondary-fixed": "#e9ddff",
                        "secondary": "#cdc0e9",
                        "on-surface": "#e6e0e9",
                        "on-secondary": "#342b4b",
                        "on-secondary-fixed": "#1f1635",
                        "primary-fixed": "#e9ddff",
                        "primary-container": "#6750a4",
                        "surface-container-lowest": "#0f0d13",
                        "on-primary-fixed": "#22005d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "xs": "4px",
                        "touch-target": "44px",
                        "md": "16px",
                        "grid-cell": "32px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "headline-panel": ["Space Grotesk"],
                        "label-mono-sm": ["JetBrains Mono"],
                        "body-standard": ["Geist"],
                        "label-mono": ["JetBrains Mono"],
                        "display-score": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "headline-panel": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-mono-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-standard": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "display-score": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .cyber-grid {
            background-image: linear-gradient(to right, rgba(51, 65, 85, 0.2) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(51, 65, 85, 0.2) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .neon-border-error {
            box-shadow: 0 0 15px rgba(255, 180, 171, 0.3), inset 0 0 10px rgba(255, 180, 171, 0.1);
        }
        .neon-border-primary {
            box-shadow: 0 0 10px rgba(207, 188, 255, 0.2);
        }
        .text-glow-error {
            text-shadow: 0 0 20px rgba(255, 180, 171, 0.6);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden cyber-grid">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-error-container/20 via-background to-background z-0"></div>
<!-- Main Game Over Card -->
<main class="relative z-10 flex flex-col items-center w-full max-w-md px-md py-xl gap-xl">
<!-- Header -->
<div class="text-center w-full">
<h1 class="font-display-score text-display-score text-error text-glow-error tracking-tighter uppercase mb-xs">SYSTEM HALT</h1>
<p class="font-label-mono text-label-mono text-error uppercase tracking-widest">CRITICAL FAILURE IMMINENT</p>
</div>
<!-- Stats Container -->
<div class="w-full bg-surface-container border border-outline-variant p-lg rounded-DEFAULT neon-border-primary flex flex-col gap-md">
<!-- Final Score -->
<div class="flex justify-between items-end border-b border-outline-variant pb-sm">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase">FINAL SCORE</span>
<span class="font-display-score text-display-score text-primary leading-none">24,590</span>
</div>
<!-- Secondary Stats Grid -->
<div class="grid grid-cols-2 gap-md pt-sm">
<div class="flex flex-col bg-surface p-sm border border-outline-variant rounded-sm">
<span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant uppercase mb-xs">LEVEL REACHED</span>
<span class="font-headline-panel text-headline-panel text-on-surface text-right">14</span>
</div>
<div class="flex flex-col bg-surface p-sm border border-outline-variant rounded-sm">
<span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant uppercase mb-xs">LINES CLEARED</span>
<span class="font-headline-panel text-headline-panel text-on-surface text-right">142</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full min-h-touch-target bg-primary text-on-primary font-headline-panel text-headline-panel uppercase border border-primary hover:bg-primary-fixed hover:text-on-primary-fixed transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">replay</span>
                REBOOT SEQUENCE
            </button>
<div class="grid grid-cols-2 gap-sm w-full">
<button class="w-full min-h-touch-target bg-surface text-on-surface border border-outline-variant hover:bg-surface-variant hover:text-primary transition-colors font-label-mono text-label-mono uppercase flex items-center justify-center gap-xs">
<span class="material-symbols-outlined">menu</span>
                    MAIN MENU
                </button>
<button class="w-full min-h-touch-target bg-surface text-on-surface border border-outline-variant hover:bg-surface-variant hover:text-tertiary transition-colors font-label-mono text-label-mono uppercase flex items-center justify-center gap-xs">
<span class="material-symbols-outlined">share</span>
                    SHARE DATA
                </button>
</div>
</div>
</main>
<!-- Suppressed Navigation Shells (Context: Transactional/Terminal Screen) -->
<!-- TopAppBar, SideNavBar, BottomNavBar are intentionally omitted as this is a dead-end overlay screen -->
</body></html>
