<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Geist:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed-variant": "#594400",
                      "on-primary-fixed-variant": "#4f378a",
                      "on-tertiary-fixed": "#241a00",
                      "on-background": "#F8FAFC",
                      "surface-container-high": "#2b292f",

                      "on-error": "#690005",
                      "surface-container-low": "#1d1b20",
                      "on-tertiary-container": "#503d00",
                      "error-container": "#93000a",
                      "surface-variant": "#36343a",
                      "surface": "#141218",
                      "on-primary": "#381e72",
                      "inverse-on-surface": "#322f35",
                      "on-secondary-container": "#bfb2da",
                      "tertiary": "#e7c365",
                      "surface-container": "#211f24",
                      "surface-container-highest": "#36343a",
                      "surface-tint": "#cfbcff",
                      "secondary-fixed-dim": "#cdc0e9",
                      "inverse-primary": "#6750a4",
                      "on-secondary-fixed-variant": "#4b4263",
                      "secondary-container": "#4d4465",
                      "surface-dim": "#141218",
                      "on-surface-variant": "#cbc4d2",
                      "primary-fixed-dim": "#cfbcff",
                      "primary": "#cfbcff",
                      "background": "#141218",
                      "tertiary-fixed": "#ffdf93",
                      "on-error-container": "#ffdad6",
                      "outline": "#948e9c",
                      "inverse-surface": "#e6e0e9",

                      "on-tertiary": "#3e2e00",
                      "secondary-fixed": "#e9ddff",

              "spacing": {
                      "sm": "8px",
                      "lg": "24px",

                      "touch-target": "44px",
                      "md": "16px",
                      "grid-cell": "32px",
                      "unit": "4px"

              "fontFamily": {
                      "headline-panel": [

                      "label-mono-sm": [
                              "JetBrains Mono"

                      "body-standard": [
                              "Geist"
                      ],
                      "label-mono": [
                              "JetBrains Mono"
                      ],
                      "display-score": [

                      ]
              },
              "fontSize": {
                      "headline-panel": [
                              "18px",

                      ],
                      "display-score": [

          },
        }

</head>
<body class="bg-[#141218] text-[#F8FAFC] min-h-screen flex flex-col relative overflow-hidden antialiased">
<!-- Background overlay: Stylized game in progress -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at center, rgba(51, 65, 85, 0.4) 1px, transparent 1px); background-size: 32px 32px;"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center z-10 px-md relative w-full max-w-7xl mx-auto h-screen">
<!-- Game Title -->
<div class="mb-xl text-center flex flex-col items-center gap-md">
<h1 class="font-display-score text-display-score text-primary tracking-tighter" style="text-shadow: 0 0 15px rgba(207,188,255,0.8), 0 0 30px rgba(207,188,255,0.4);">Tetris Supervisor Root Fix</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest border border-outline-variant px-md py-xs bg-surface-container-low">Main Menu</p>
</div>
<!-- Menu Actions -->
<div class="flex flex-col gap-md w-full max-w-sm">
<button class="w-full h-touch-target flex items-center justify-center gap-sm bg-primary text-on-primary font-headline-panel text-headline-panel border-2 border-primary rounded-DEFAULT hover:bg-primary-fixed-dim hover:text-on-primary-fixed transition-colors duration-200 shadow-[0_0_15px_rgba(207,188,255,0.6)] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-[#141218]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Start Game
            </button>
<a class="w-full h-touch-target flex items-center justify-center gap-sm bg-surface text-primary font-headline-panel text-headline-panel border-2 border-outline-variant rounded-DEFAULT hover:border-primary hover:bg-surface-variant transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-[#141218]" href="#settings">
<span class="material-symbols-outlined">settings</span>
                Settings
            </a>
<a class="w-full h-touch-target flex items-center justify-center gap-sm bg-surface text-primary font-headline-panel text-headline-panel border-2 border-outline-variant rounded-DEFAULT hover:border-primary hover:bg-surface-variant transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-[#141218]" href="#how-to-play">
<span class="material-symbols-outlined">help</span>
                How to Play
            </a>
</div>
</main>
</body></html>
