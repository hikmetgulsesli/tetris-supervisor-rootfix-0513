<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Board</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Geist:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#594400",
                    "on-primary-fixed-variant": "#4f378a",
                    "on-tertiary-fixed": "#241a00",
                    "on-background": "#e6e0e9",
                    "surface-container-high": "#2b292f",
                    "tertiary-fixed-dim": "#e7c365",
                    "outline-variant": "#494551",
                    "on-error": "#690005",
                    "surface-container-low": "#1d1b20",
                    "on-tertiary-container": "#503d00",
                    "error-container": "#93000a",
                    "surface-variant": "#36343a",
                    "surface": "#141218",
                    "on-primary": "#381e72",
                    "inverse-on-surface": "#322f35",
                    "on-secondary-container": "#bfb2da",
                    "tertiary": "#e7c365",
                    "surface-container": "#211f24",
                    "surface-container-highest": "#36343a",
                    "surface-tint": "#cfbcff",
                    "secondary-fixed-dim": "#cdc0e9",
                    "inverse-primary": "#6750a4",
                    "on-secondary-fixed-variant": "#4b4263",
                    "secondary-container": "#4d4465",
                    "surface-dim": "#141218",
                    "on-surface-variant": "#cbc4d2",
                    "primary-fixed-dim": "#cfbcff",
                    "primary": "#cfbcff",
                    "background": "#141218",
                    "tertiary-fixed": "#ffdf93",
                    "on-error-container": "#ffdad6",
                    "outline": "#948e9c",
                    "inverse-surface": "#e6e0e9",
                    "surface-bright": "#3b383e",
                    "tertiary-container": "#c9a74d",
                    "error": "#ffb4ab",
                    "on-primary-container": "#e0d2ff",
                    "on-tertiary": "#3e2e00",
                    "secondary-fixed": "#e9ddff",
                    "secondary": "#cdc0e9",
                    "on-surface": "#e6e0e9",
                    "on-secondary": "#342b4b",
                    "on-secondary-fixed": "#1f1635",
                    "primary-fixed": "#e9ddff",
                    "primary-container": "#6750a4",
                    "surface-container-lowest": "#0f0d13",
                    "on-primary-fixed": "#22005d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "lg": "24px",
                    "xl": "32px",
                    "xs": "4px",
                    "touch-target": "44px",
                    "md": "16px",
                    "grid-cell": "32px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "headline-panel": ["Space Grotesk"],
                    "label-mono-sm": ["JetBrains Mono"],
                    "body-standard": ["Geist"],
                    "label-mono": ["JetBrains Mono"],
                    "display-score": ["Space Grotesk"]
            },
            "fontSize": {
                    "headline-panel": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-mono-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-standard": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "display-score": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        .game-grid-bg {
            background-image: 
                linear-gradient(to right, rgba(51, 65, 85, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(51, 65, 85, 0.2) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .tetromino-glow-primary {
            box-shadow: inset 0 0 8px theme('colors.primary'), 0 0 4px theme('colors.primary');
            background-color: rgba(207, 188, 255, 0.8);
            border: 1px solid theme('colors.primary');
        }
        
        .tetromino-glow-secondary {
            box-shadow: inset 0 0 8px theme('colors.secondary'), 0 0 4px theme('colors.secondary');
            background-color: rgba(205, 192, 233, 0.8);
            border: 1px solid theme('colors.secondary');
        }

        .tetromino-glow-tertiary {
            box-shadow: inset 0 0 8px theme('colors.tertiary'), 0 0 4px theme('colors.tertiary');
            background-color: rgba(231, 195, 101, 0.8);
            border: 1px solid theme('colors.tertiary');
        }

        /* Scanline effect for background */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-standard overflow-hidden relative">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant shadow-[0_0_15px_rgba(207,188,255,0.1)] flex justify-between items-center px-lg py-sm w-full z-50">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-primary">terminal</span>
<span class="font-headline-panel text-headline-panel font-bold tracking-tighter text-primary dark:text-primary">SUPERVISOR ROOT</span>
</div>
<div class="flex items-center gap-md">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant dark:hover:bg-surface-variant transition-colors duration-200 p-xs rounded">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant dark:hover:bg-surface-variant transition-colors duration-200 p-xs rounded">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant dark:hover:bg-surface-variant transition-colors duration-200 p-xs rounded">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Game Area -->
<main class="flex-grow flex items-center justify-center relative z-10 p-md h-full overflow-hidden">
<div class="flex flex-col lg:flex-row gap-lg items-center lg:items-stretch h-full w-full max-w-[1200px] justify-center">
<!-- Left Panel (Hold & Stats on Desktop, Top on Mobile) -->
<div class="flex lg:flex-col gap-md lg:w-48 order-2 lg:order-1 justify-between lg:justify-start w-full">
<!-- Hold Panel -->
<div class="bg-surface border border-outline-variant p-md rounded flex flex-col">
<h2 class="font-headline-panel text-headline-panel text-on-surface mb-sm">HOLD</h2>
<div class="w-full aspect-square border border-outline-variant bg-surface-container-lowest game-grid-bg relative p-xs flex items-center justify-center">
<!-- Preview Tetromino (T-Shape) -->
<div class="grid grid-cols-3 grid-rows-2 gap-[1px] w-[75%] h-[75%] opacity-50">
<div class="col-start-2 tetromino-glow-secondary"></div>
<div class="col-start-1 row-start-2 tetromino-glow-secondary"></div>
<div class="col-start-2 row-start-2 tetromino-glow-secondary"></div>
<div class="col-start-3 row-start-2 tetromino-glow-secondary"></div>
</div>
</div>
</div>
<!-- Stats Panels -->
<div class="flex lg:flex-col gap-sm lg:mt-auto flex-grow justify-end">
<div class="bg-surface border border-outline-variant p-sm rounded text-right flex flex-col justify-center flex-grow lg:flex-grow-0">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase">SCORE</span>
<span class="font-display-score text-display-score text-primary tracking-tighter">042,900</span>
</div>
<div class="bg-surface border border-outline-variant p-sm rounded text-right flex flex-col justify-center flex-grow lg:flex-grow-0">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase">LEVEL</span>
<span class="font-headline-panel text-[24px] font-bold text-on-surface">12</span>
</div>
<div class="bg-surface border border-outline-variant p-sm rounded text-right flex flex-col justify-center flex-grow lg:flex-grow-0">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase">LINES</span>
<span class="font-headline-panel text-[24px] font-bold text-on-surface">144</span>
</div>
</div>
</div>
<!-- Center Game Board -->
<div class="order-1 lg:order-2 flex-shrink-0 relative">
<!-- Focus State Border (Mandatory for active interaction area) -->
<div class="absolute -inset-[2px] border-2 border-primary rounded-sm opacity-50 blur-[2px] pointer-events-none"></div>
<div class="absolute -inset-[2px] border-2 border-primary rounded-sm opacity-80 pointer-events-none"></div>
<div class="w-[320px] h-[640px] bg-surface-container-lowest border border-outline-variant relative overflow-hidden game-grid-bg">
<!-- Placed Blocks (Example) -->
<div class="absolute bottom-0 left-0 w-full h-[160px]">
<!-- Row 1 (Bottom) -->
<div class="absolute bottom-0 left-[0px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
<div class="absolute bottom-0 left-[32px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
<div class="absolute bottom-0 left-[64px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
<div class="absolute bottom-0 left-[96px] w-[32px] h-[32px] tetromino-glow-secondary"></div>
<div class="absolute bottom-0 left-[160px] w-[32px] h-[32px] tetromino-glow-primary"></div>
<div class="absolute bottom-0 left-[192px] w-[32px] h-[32px] tetromino-glow-primary"></div>
<div class="absolute bottom-0 left-[256px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
<div class="absolute bottom-0 left-[288px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
<!-- Row 2 -->
<div class="absolute bottom-[32px] left-[0px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
<div class="absolute bottom-[32px] left-[96px] w-[32px] h-[32px] tetromino-glow-secondary"></div>
<div class="absolute bottom-[32px] left-[128px] w-[32px] h-[32px] tetromino-glow-secondary"></div>
<div class="absolute bottom-[32px] left-[160px] w-[32px] h-[32px] tetromino-glow-primary"></div>
<div class="absolute bottom-[32px] left-[192px] w-[32px] h-[32px] tetromino-glow-primary"></div>
<div class="absolute bottom-[32px] left-[256px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
<!-- Row 3 -->
<div class="absolute bottom-[64px] left-[128px] w-[32px] h-[32px] tetromino-glow-secondary"></div>
<div class="absolute bottom-[64px] left-[256px] w-[32px] h-[32px] tetromino-glow-tertiary"></div>
</div>
<!-- Active Falling Piece (J-Shape) -->
<div class="absolute top-[160px] left-[128px] w-[64px] h-[96px]">
<div class="absolute top-0 right-0 w-[32px] h-[32px] tetromino-glow-primary"></div>
<div class="absolute top-[32px] right-0 w-[32px] h-[32px] tetromino-glow-primary"></div>
<div class="absolute top-[64px] right-0 w-[32px] h-[32px] tetromino-glow-primary"></div>
<div class="absolute top-[64px] left-0 w-[32px] h-[32px] tetromino-glow-primary"></div>
</div>
<!-- Ghost Piece -->
<div class="absolute bottom-[96px] left-[128px] w-[64px] h-[96px] opacity-20 border border-primary">
<div class="absolute top-0 right-0 w-[32px] h-[32px] border border-primary"></div>
<div class="absolute top-[32px] right-0 w-[32px] h-[32px] border border-primary"></div>
<div class="absolute top-[64px] right-0 w-[32px] h-[32px] border border-primary"></div>
<div class="absolute top-[64px] left-0 w-[32px] h-[32px] border border-primary"></div>
</div>
<!-- Pause Overlay (Hidden by default, shown for structure context) -->
<!-- 
                    <div class="absolute inset-0 bg-background/80 flex flex-col items-center justify-center z-20">
                        <span class="font-headline-panel text-headline-panel text-primary mb-lg">PAUSED</span>
                        <span class="material-symbols-outlined text-[48px] text-primary">pause_circle</span>
                    </div> 
                    -->
</div>
</div>
<!-- Right Panel (Next Pieces) -->
<div class="flex flex-row lg:flex-col gap-md lg:w-48 order-3 w-full justify-between lg:justify-start">
<div class="bg-surface border border-outline-variant p-md rounded flex flex-col w-full">
<h2 class="font-headline-panel text-headline-panel text-on-surface mb-sm">NEXT</h2>
<!-- Next 1 -->
<div class="w-full aspect-square border border-outline-variant bg-surface-container-lowest game-grid-bg relative p-xs flex items-center justify-center mb-sm">
<!-- Preview Tetromino (I-Shape) -->
<div class="grid grid-cols-4 grid-rows-1 gap-[1px] w-[90%] h-[25%]">
<div class="tetromino-glow-primary"></div>
<div class="tetromino-glow-primary"></div>
<div class="tetromino-glow-primary"></div>
<div class="tetromino-glow-primary"></div>
</div>
</div>
<!-- Next 2 & 3 (Smaller) -->
<div class="flex lg:flex-col gap-sm">
<div class="flex-1 aspect-square border border-outline-variant bg-surface-container-lowest relative flex items-center justify-center p-xs">
<!-- Preview Tetromino (O-Shape) -->
<div class="grid grid-cols-2 grid-rows-2 gap-[1px] w-[50%] h-[50%] opacity-70">
<div class="tetromino-glow-tertiary"></div>
<div class="tetromino-glow-tertiary"></div>
<div class="tetromino-glow-tertiary"></div>
<div class="tetromino-glow-tertiary"></div>
</div>
</div>
<div class="flex-1 aspect-square border border-outline-variant bg-surface-container-lowest relative flex items-center justify-center p-xs">
<!-- Preview Tetromino (S-Shape) -->
<div class="grid grid-cols-3 grid-rows-2 gap-[1px] w-[75%] h-[50%] opacity-50">
<div class="col-start-2 tetromino-glow-secondary"></div>
<div class="col-start-3 tetromino-glow-secondary"></div>
<div class="col-start-1 row-start-2 tetromino-glow-secondary"></div>
<div class="col-start-2 row-start-2 tetromino-glow-secondary"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Nav / Mobile Controls Shell -->
<nav class="lg:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-touch-target px-md bg-surface-container-highest dark:bg-surface-container-highest shadow-[0_-4px_20px_rgba(231,195,101,0.1)]">
<a class="flex flex-col items-center justify-center bg-tertiary-container text-on-tertiary-container rounded-lg px-lg py-xs" href="#">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
<span class="font-label-mono-sm text-label-mono-sm">GAME</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-lg py-xs hover:text-tertiary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="monitoring">monitoring</span>
<span class="font-label-mono-sm text-label-mono-sm">STATS</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-lg py-xs hover:text-tertiary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label-mono-sm text-label-mono-sm">SOCIAL</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-lg py-xs hover:text-tertiary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="security">security</span>
<span class="font-label-mono-sm text-label-mono-sm">ROOT</span>
</a>
</nav>
<!-- Desktop Side Nav (Hidden on Mobile) -->
<nav class="hidden lg:flex flex-col fixed left-0 top-0 h-full z-40 py-xl bg-surface-container-low dark:bg-surface-container-low w-64 pt-20">
<div class="px-md mb-xl flex flex-col gap-sm">
<span class="text-headline-panel font-headline-panel text-primary">OPERATOR</span>
<span class="font-label-mono text-label-mono text-on-surface-variant">V.01-ROOT</span>
</div>
<div class="flex flex-col gap-sm">
<a class="bg-primary-container text-on-primary-container font-bold border-l-4 border-primary px-md py-sm flex items-center gap-md" href="#">
<span class="material-symbols-outlined" data-icon="videogame_asset">videogame_asset</span>
<span class="font-label-mono text-label-mono">CLASSIC</span>
</a>
<a class="text-on-surface-variant px-md py-sm flex items-center gap-md hover:bg-surface-variant hover:text-on-surface transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="timer">timer</span>
<span class="font-label-mono text-label-mono">SPRINT</span>
</a>
<a class="text-on-surface-variant px-md py-sm flex items-center gap-md hover:bg-surface-variant hover:text-on-surface transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-mono text-label-mono">RANKED</span>
</a>
<a class="text-on-surface-variant px-md py-sm flex items-center gap-md hover:bg-surface-variant hover:text-on-surface transition-all duration-150 mt-auto" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-mono text-label-mono">SETTINGS</span>
</a>
</div>
</nav>
</body></html>
